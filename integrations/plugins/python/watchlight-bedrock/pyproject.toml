[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchlight-bedrock"
version = "0.4.0"
description = "Watchlight authorization for AWS Bedrock action-group Lambdas: each call is allowed or refused before the Lambda body runs, fail-closed. Bedrock's own planning and model turns are not gated (independent plugin, not affiliated with AWS)"
readme = "README.md"
# SPDX licence expression (PEP 639; setuptools 77 or later).
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Watchlight AI", email = "team@watchlight.ai"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "httpx>=0.27",
    "watchlight-agent-sdk>=0.10.1,<0.11",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]
aws = ["boto3>=1.34"]

[project.urls]
Homepage = "https://watchlight.ai"
Documentation = "https://docs.watchlight.ai/de"
Repository = "https://github.com/watchlight-ai-beacon/watchlight-de"
Issues = "https://github.com/watchlight-ai-beacon/watchlight-de/issues"

[tool.setuptools.packages.find]
include = ["watchlight_bedrock*"]
