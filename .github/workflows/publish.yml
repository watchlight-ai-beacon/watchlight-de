# Publish the `watchlight` umbrella package (Developer Edition) to PyPI.
#
# `watchlight` is pure-Python and Apache-2.0 (the OPEN glue: the `govern`
# decorator, the framework plugin shims, and the `watchlight dev` dashboard). It
# depends on the compiled `watchlight-engine` wheel but vendors no proprietary
# source — so unlike the engine, publishing an sdist is fine and expected.
#
# Manual trigger, dry-run by default. Trusted publishing (OIDC) — no stored token.
#
# ─── OPERATOR PREREQUISITES (one-time) ───
#   1. Reserve `watchlight` on PyPI under the `watchlight-ai` PyPI org.
#   2. Configure a PyPI Trusted Publisher (OIDC) with the GitHub identifiers:
#        PyPI project name: watchlight
#        Owner (GitHub):    watchlight-ai-beacon
#        Repository:        watchlight-de
#        Workflow name:     publish.yml
#        Environment:       pypi
#   3. The `pypi` GitHub Environment accepts deployments only from `main` and
#      `v*` tags. We publish to PyPI only: run a dry run first, then the real
#      publish.

name: Publish watchlight (PyPI)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + check dists but SKIP the upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: "Publish to PyPI"
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC — trusted publishing mints a short-lived token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Publish (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          print-hash: true
