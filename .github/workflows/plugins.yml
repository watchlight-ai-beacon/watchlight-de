# Test the plugins and SDKs under integrations/plugins/.
#
# Each Python package under integrations/plugins/python/ and each TypeScript
# package in the integrations/plugins/ts/ workspace is its own package, with its
# own manifest and its own tests. scripts/preflight.sh does not run them; this
# workflow does. It finds the packages from the tree rather than from a list
# kept here, so a new package is tested from the commit that adds it.
#
#   * python      one job per package and per Python version from 3.10 to 3.13
#                 that both the package's `requires-python` and the
#                 hash-pinned lock (python/ci/plugins.txt) accept. Third-party
#                 packages come only from the lock; the SDK
#                 (watchlight-core), the test doubles
#                 (watchlight-agent-sdk-testing) and the package are installed
#                 from this commit, never from a release. The compiled engine
#                 comes from its own lock (python/ci/engine.txt) and is
#                 required, never skipped.
#   * adk-min     watchlight-adk again at its declared minimum google-adk
#                 (python/ci/adk-min.txt): a floor the suite only passes above
#                 is a wrong floor.
#   * dist        every published Python package built offline and its wheel
#                 and sdist scanned (python/ci/check_dist.py).
#   * typescript  the whole npm workspace: npm ci, build, typecheck, test.
#
# While a directory holds no packages, its job says so in a notice and passes.
#
# The same rules as preflight.yml apply: `pull_request`, never
# `pull_request_target`, so a fork's code runs with a read-only token and no
# secrets; the token is not persisted into the checkout; every action is pinned
# to a full commit SHA.

name: Plugins

on:
  pull_request:
    paths:
      - "integrations/plugins/**"
      - ".github/workflows/plugins.yml"
      - ".github/workflows/publish-plugins.yml"
  push:
    branches: [main]
    paths:
      - "integrations/plugins/**"
      - ".github/workflows/plugins.yml"
      - ".github/workflows/publish-plugins.yml"

# Least privilege: reading the checkout is the only thing this needs.
permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover python packages
    # GitHub-hosted runners only: this repository is public, and a
    # self-hosted runner never takes its jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.find.outputs.count }}
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Reads every integrations/plugins/python/*/pyproject.toml and emits one
      # matrix entry per (package, Python version) that `requires-python`
      # accepts. A directory name outside [a-z0-9._-], an unreadable
      # pyproject.toml, or a package that accepts none of the tested versions
      # fails the run instead of quietly dropping the package.
      - name: Find the Python packages
        id: find
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "packaging==25.0"
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          from packaging.specifiers import InvalidSpecifier, SpecifierSet

          VERSIONS = ["3.10", "3.11", "3.12", "3.13"]
          root = pathlib.Path("integrations/plugins/python")

          # The lock states the lowest Python it resolves for; a version below
          # it would install unlocked packages, so it is not tested.
          lock = root / "ci" / "plugins.txt"
          floor = re.search(r"\(Python (3\.\d+) and later", lock.read_text(encoding="utf-8").splitlines()[0])
          if not floor:
              raise SystemExit(f"::error::{lock}: the first line does not state the lock's Python floor")
          floor = tuple(int(x) for x in floor.group(1).split("."))
          VERSIONS = [v for v in VERSIONS if tuple(int(x) for x in v.split(".")) >= floor]

          # The open package roots and the name each one is released under. A
          # directory that is not listed, or a package that names itself
          # anything else, fails the run: nothing is added to this tree, or
          # released from it, under a name that was not reviewed.
          ALLOWED = {
              "plugin-template": "watchlight-template-plugin",
              "watchlight-agent-sdk-testing": "watchlight-agent-sdk-testing",
              "watchlight-adk": "watchlight-adk",
              "watchlight-bedrock": "watchlight-bedrock",
              "watchlight-claude-agent": "watchlight-claude-agent",
              "watchlight-core": "watchlight-agent-sdk",
              "watchlight-deepagents": "watchlight-deepagents",
              "watchlight-langgraph": "watchlight-langgraph",
              "watchlight-msaf": "watchlight-msaf",
              "watchlight-pydantic-ai": "watchlight-pydantic-ai",
              "watchlight-strands": "watchlight-strands",
          }
          #: Directories that hold no package.
          SUPPORT = {"ci"}

          include, errors = [], []
          for entry in sorted(p for p in root.iterdir() if p.is_dir()):
              if entry.name not in ALLOWED and entry.name not in SUPPORT:
                  errors.append(f"{entry.name}: not an open package root of this directory")
              elif entry.name in ALLOWED and not (entry / "pyproject.toml").is_file():
                  errors.append(f"{entry.name}: no pyproject.toml")
          for pyproject in sorted(root.glob("*/pyproject.toml")):
              name = pyproject.parent.name
              if not re.fullmatch(r"[a-z0-9][a-z0-9._-]*", name):
                  errors.append(f"{name!r}: directory names may use only a-z, 0-9, '.', '_' and '-'")
                  continue
              if name not in ALLOWED:
                  continue
              try:
                  project = tomllib.loads(pyproject.read_text(encoding="utf-8")).get("project", {})
                  spec = SpecifierSet(project.get("requires-python", ""))
              except (tomllib.TOMLDecodeError, InvalidSpecifier, UnicodeDecodeError) as exc:
                  errors.append(f"{name}: cannot read pyproject.toml: {exc}")
                  continue
              if project.get("name") != ALLOWED[name]:
                  errors.append(f"{name}: package name {project.get('name')!r}, expected {ALLOWED[name]!r}")
                  continue
              versions = [v for v in VERSIONS if spec.contains(v)]
              if not versions:
                  errors.append(f"{name}: requires-python {str(spec)!r} accepts none of the locked {', '.join(VERSIONS)}")
                  continue
              include += [{"package": name, "python": v} for v in versions]
              print(f"{name}: Python {', '.join(versions)}")

          for error in errors:
              print(f"::error::{error}")
          if errors:
              raise SystemExit(1)

          if not include:
              print("::notice::No Python packages under integrations/plugins/python/ yet; there is nothing to test.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"count={len(include)}\n")
              out.write(f"matrix={json.dumps({'include': include})}\n")
          PY

  python:
    name: python (${{ matrix.package }}, ${{ matrix.python }})
    needs: discover
    # An empty matrix is an error in GitHub Actions, so the job is skipped,
    # with the discover job's notice saying why, when there is nothing to test.
    if: needs.discover.outputs.count != '0'
    # GitHub-hosted runners only: this repository is public, and a
    # self-hosted runner never takes its jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # The package name reaches the script through the environment, never by
      # expression interpolation into the script text.
      - name: Install the package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          base="$GITHUB_WORKSPACE/integrations/plugins/python"
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          pip=("$py" -m pip install --disable-pip-version-check --quiet)
          # Third-party packages: wheels only, every one hash-checked, nothing
          # resolved at install time.
          "${pip[@]}" --require-hashes --only-binary :all: --no-deps -r "$base/ci/plugins.txt"
          if [ ! -f "$base/ci/engine.txt" ]; then
            echo "::error::$base/ci/engine.txt is missing: the engine is installed only from its lock"
            exit 1
          fi
          "${pip[@]}" --require-hashes --only-binary :all: --no-deps -r "$base/ci/engine.txt"
          # This commit's packages, editable and without dependencies, so no
          # install can replace one with a release. The SDK's suite also runs
          # every plugin against the SDK (a required plugin that cannot load
          # fails), so its job installs every package of this directory; their
          # third-party dependencies are already in the lock.
          dirs=(watchlight-core watchlight-agent-sdk-testing "$PACKAGE")
          if [ "$PACKAGE" = "watchlight-core" ]; then
            for d in "$base"/*/pyproject.toml; do
              d=$(basename "$(dirname "$d")")
              case "$d" in watchlight-core | watchlight-agent-sdk-testing) ;; *) dirs+=("$d") ;; esac
            done
          fi
          for dir in "${dirs[@]}"; do
            if [ -f "$base/$dir/pyproject.toml" ]; then
              "${pip[@]}" --no-deps --no-build-isolation -e "$base/$dir"
            fi
          done
          "$py" -m pip check --disable-pip-version-check
          # Every package of this directory is imported from this commit.
          "$py" - "$base" <<'PY'
          import importlib
          import pathlib
          import sys

          base = pathlib.Path(sys.argv[1]).resolve()
          for module in ("watchlight_core", "watchlight_core_testing"):
              actual = pathlib.Path(importlib.import_module(module).__file__).resolve()
              if base not in actual.parents:
                  print(f"::error::{module} was imported from {actual}, not from {base}.")
                  raise SystemExit(1)
              print(f"{module} from {actual}")
          PY

      - name: Run the tests
        env:
          PACKAGE: ${{ matrix.package }}
          # A test that needs the engine fails instead of skipping.
          WATCHLIGHT_REQUIRE_ENGINE: "1"
        working-directory: integrations/plugins/python/${{ matrix.package }}
        run: |
          set -euo pipefail
          # pytest exits 5 when it collects no tests; that fails the job, so a
          # package with no tests never passes by default.
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q

  adk-min:
    name: python (watchlight-adk at its minimum google-adk)
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install watchlight-adk at its floor
        run: |
          set -euo pipefail
          base="$GITHUB_WORKSPACE/integrations/plugins/python"
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          pip=("$py" -m pip install --disable-pip-version-check --quiet)
          "${pip[@]}" --require-hashes --only-binary :all: --no-deps -r "$base/ci/adk-min.txt"
          for dir in watchlight-core watchlight-agent-sdk-testing watchlight-adk; do
            "${pip[@]}" --no-deps --no-build-isolation -e "$base/$dir"
          done
          "$py" -m pip check --disable-pip-version-check

      - name: Run the tests
        working-directory: integrations/plugins/python/watchlight-adk
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q

  dist:
    name: python distributions
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The checks' own tests run first, so a bug in one fails here rather
      # than passing the packages. test_publish_workflow pins the publish
      # workflow's safety properties.
      - name: Test the distribution checks
        working-directory: integrations/plugins/python/ci
        run: python -m unittest -v test_check_dist test_check_published_deps test_publish_workflow

      - name: Build and scan every published package
        run: |
          set -euo pipefail
          base="$GITHUB_WORKSPACE/integrations/plugins/python"
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -m pip install --disable-pip-version-check --quiet --require-hashes --only-binary :all: --no-deps -r "$base/ci/dist.txt"
          "$py" "$base/ci/check_dist.py" --build --python "$py"

  typescript:
    name: typescript (node ${{ matrix.node }})
    # GitHub-hosted runners only: this repository is public, and a
    # self-hosted runner never takes its jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the floor the workspace declares in `engines`; 24 is the
        # current LTS.
        node: ["22", "24"]
    defaults:
      run:
        working-directory: integrations/plugins/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # A workspace step runs a script only in the packages that define it, so
      # a package without `typecheck` would pass that step without being
      # checked. Refuse a package that leaves out build, typecheck or test.
      - name: Find the TypeScript packages
        id: find
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");

          const packages = fs.readdirSync(".", { withFileTypes: true })
            .filter((d) => d.isDirectory() && d.name !== "node_modules")
            .map((d) => d.name)
            .filter((name) => fs.existsSync(path.join(name, "package.json")))
            .sort();

          let failed = false;
          for (const name of packages) {
            const scripts = JSON.parse(fs.readFileSync(path.join(name, "package.json"), "utf8")).scripts ?? {};
            const missing = ["build", "typecheck", "test"].filter((s) => typeof scripts[s] !== "string");
            if (missing.length) {
              console.log(`::error::${name}: package.json defines no ${missing.join(", ")} script`);
              failed = true;
            } else {
              console.log(name);
            }
          }
          if (failed) process.exit(1);
          if (packages.length === 0) {
            console.log("::notice::No TypeScript packages in the integrations/plugins/ts/ workspace yet; there is nothing to test.");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `present=${packages.length > 0}\n`);
          JS

      - name: npm ci
        if: steps.find.outputs.present == 'true'
        run: npm ci

      - name: npm run build
        if: steps.find.outputs.present == 'true'
        run: npm run build

      - name: npm run typecheck
        if: steps.find.outputs.present == 'true'
        run: npm run typecheck

      - name: npm test
        if: steps.find.outputs.present == 'true'
        run: npm test
