[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchlight"
version = "0.8.1"
description = "Watchlight Developer Edition — govern AI agents in-process, with zero infrastructure."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Watchlight AI" }]
keywords = ["authorization", "ai-agents", "cedar", "policy", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # The in-process authorization engine — the real Watchlight policy engine
    # (Cedar evaluation + the surrounding pipeline), embedded via PyO3 and
    # published to PyPI as `watchlight-engine`.
    "watchlight-engine>=0.2,<0.3",
]

[project.optional-dependencies]
# Govern an existing framework agent in-process. Each extra pulls the published
# framework plugin (which pulls the Watchlight SDK); the SAME plugin you ship to
# production, wired here to the in-process engine via
# `watchlight.<framework>.governed_plugin`.
langgraph = ["watchlight-langgraph>=0.4"]
pydantic-ai = ["watchlight-pydantic-ai>=0.3"]
claude-agent = ["watchlight-claude-agent>=0.2"]
# Govern an MCP server: the Watchlight MCP Runtime PEP — a policy enforcement
# point in front of any MCP (2026-07-28) server. See examples/governed_mcp_server.py.
mcp = ["watchlight-mcp>=0.4.0"]
# Govern a deepagents deep agent: every sub-agent gets a strict-subset of the
# parent's tools (scope attenuation), up to the DE depth-5 ceiling. Config-only —
# no deepagents source is touched. See examples/governed_deepagents.py.
deepagents = ["deepagents>=0.7"]
# The lower-level lifecycle SDK — InProcessClient, sessions, preflight, local
# lineage. NOTE: it installs as the module `watchlight_core` (there is no
# `watchlight-core` distribution). See docs/developer-edition/governed-agents.
sdk = ["watchlight-agent-sdk>=0.6"]
# Everything the DE docs use, in one install: `pip install "watchlight[all]"`.
# Pulls the SDK, every framework plugin, and the MCP PEP so every example on
# docs.watchlight.ai/de runs without hunting for the right package.
all = [
    "watchlight-agent-sdk>=0.6",
    "watchlight-langgraph>=0.4",
    "watchlight-pydantic-ai>=0.3",
    "watchlight-claude-agent>=0.2",
    "watchlight-mcp>=0.4.0",
    "deepagents>=0.7",
]

[project.scripts]
# `watchlight dev` → the local decision dashboard (stdlib-only, zero extra deps).
watchlight = "watchlight.cli:main"

[project.urls]
Homepage = "https://watchlight.ai"
Documentation = "https://docs.watchlight.ai/de"

[tool.setuptools.packages.find]
where = ["src"]
